name: Publish project tracker
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, deleted, transferred, closed, reopened, labeled, unlabeled, milestoned, demilestoned]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build static site and latest public issue snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_site.py --output "$RUNNER_TEMP/research-site"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/research-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
